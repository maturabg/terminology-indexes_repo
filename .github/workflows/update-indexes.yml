name: update-indexes

on:
  # Засега само ръчно; schedule идва в итерация 6.
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot/tag (YYYY.MM.DD[.N]); по подразбиране днешната дата (UTC)"
        required: false
        type: string
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"

permissions:
  contents: write

concurrency:
  group: update-indexes
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Determine snapshot
        id: snap
        env:
          INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            snapshot="$GITHUB_REF_NAME"
          else
            snapshot="${INPUT_SNAPSHOT:-$(date -u +%Y.%m.%d)}"
          fi
          if ! printf '%s' "$snapshot" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "invalid snapshot: $snapshot" >&2
            exit 1
          fi
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Run builders
        run: |
          uv run builders/python_glossary.py

      - name: Validate
        run: uv run builders/validate.py

      - name: Manifest
        run: uv run builders/manifest.py --snapshot "${{ steps.snap.outputs.snapshot }}"

      - name: Build SQLite
        run: uv run builders/build_sqlite.py

      - name: Compress and checksum
        run: uv run builders/package.py

      - name: Verify assets
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          zstd -t terminology-indexes-*.sqlite.zst

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.snap.outputs.snapshot }}
        run: |
          gh release create "$SNAPSHOT" \
            --target "$GITHUB_SHA" \
            --title "Snapshot $SNAPSHOT" \
            --notes-file <(printf 'Terminology indexes snapshot `%s`.\n\nVerify: `sha256sum -c SHA256SUMS`\n\n```json\n%s\n```\n' "$SNAPSHOT" "$(cat dist/manifest.json)") \
            dist/manifest.json \
            dist/terminology-indexes-"$SNAPSHOT".sqlite.zst \
            dist/SHA256SUMS
